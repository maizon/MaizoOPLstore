name: Publish pinned homebrew assets to GitHub and free CDN
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maizostore-assets
  cancel-in-progress: false

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[store assets]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install safe 7z extraction for official archives
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
      - name: Download GitHub homebrews and verify pinned SHA-256
        run: python3 build_static.py
      - name: Publish immutable checksummed content through GitHub CDN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish verified store assets [store assets]"
            git push origin HEAD:main
          fi
      - name: Print public no-server URL
        run: |
          echo "https://cdn.jsdelivr.net/gh/maizon/MaizoOPLstore@main/site/index.html"
          echo "https://cdn.jsdelivr.net/gh/maizon/MaizoOPLstore@main/site/v1/catalog"
